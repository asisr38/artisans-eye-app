services:
  artisans-eye-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    # Runtime secrets such as RESEND_API_KEY. The file is optional so the
    # container still starts without it; inquiries then return 503 (see README).
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    # The health check (GET /api/health) is inherited from the Dockerfile.
