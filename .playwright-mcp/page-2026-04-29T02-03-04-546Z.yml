      - generic [ref=e59]:
        - paragraph [ref=e61]: "The central figure is identified by visible iconography as Eleven-Headed, Thousand-Armed Avalokiteshvara, known in Tibetan as Chenrezig. Avalokiteshvara is the bodhisattva of compassion: the awakened quality that sees suffering clearly and responds."
        - paragraph [ref=e63]: "The eleven faces rise above the crown, looking outward in every direction. Around the body, the many arms open into a circular field. In many depictions of this form, eyes appear in the palms: a visual promise that compassion must both see and act."
        - paragraph [ref=e65]: This example is especially dramatic because it uses a black ground with gold drawing. The dark field quiets the image; the gold brings the figure forward slowly, detail by detail, as the viewer moves closer.
      - generic [ref=e66]:
        - article [ref=e68]:
          - heading "Eleven faces" [level=3] [ref=e69]
          - paragraph [ref=e70]: Stacked heads signal the ability to perceive suffering in every direction. In traditional readings, the uppermost head is associated with Amitabha Buddha.
        - article [ref=e72]:
          - heading "Radiating arms" [level=3] [ref=e73]
          - paragraph [ref=e74]: "The surrounding field of hands turns compassion into action: seeing, reaching, blessing, protecting, and responding without limit."
        - article [ref=e76]:
